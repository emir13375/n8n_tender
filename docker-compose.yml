services:
  n8n:
    build: .
    container_name: tender_n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=your-domain.com
      - N8N_PROTOCOL=https
      - NODE_FUNCTION_ALLOW_BUILTIN=child_process,fs,path,util
      - NODE_FUNCTION_ALLOW_EXTERNAL=mammoth,word-extractor
      - GENERIC_TIMEZONE=Asia/Bishkek
    volumes:
      - ./n8n_data:/home/node/.n8n
